[tool.poetry]
name = "babi-management"
version = "0.1.0"
description = "Système de gestion scolaire SaaS multi-tenant"
authors = ["AmanyA-ing <angeobrou09710@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0,<1.0.0"
uvicorn = { version = ">=0.27.0,<1.0.0", extras = ["standard"] }
sqlmodel = ">=0.0.14,<1.0.0"
sqlalchemy = ">=2.0.25,<3.0.0"
pydantic = { version = ">=2.6.0", extras = ["email"] }
fastapi-mail = "1.4.2"
cloudinary = ">=1.40.0,<2.0.0"  
pydantic-settings = ">=2.0.0,<3.0.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
alembic = ">=1.13.1,<2.0.0"
sentry-sdk = ">=2.0.0,<3.0.0"
firebase-admin = ">=6.0.0,<7.0.0"
celery = ">=5.3.0,<6.0.0"
redis = ">=5.0.0,<6.0.0"
python-barcode = ">=0.15.1,<1.0.0"
qrcode = { version = ">=7.4.2,<8.0.0", extras = ["pil"] }
pillow = ">=10.0.0,<11.0.0"
starlette = ">=0.36.0,<1.0.0"
httpx = ">=0.27.0,<1.0.0"
passlib = { version = ">=1.7.4,<2.0.0", extras = ["bcrypt"] }
pandas = ">=2.0.0,<3.0.0"
reportlab = ">=4.0.0,<5.0.0"
sqlalchemy-utils = ">=0.41.2,<1.0.0" 
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.3.0,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"